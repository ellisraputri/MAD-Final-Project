name: Daily Summary Job

on:
  schedule:
    - cron: "0 17 * * *" # every day at 00:00 UTC
  workflow_dispatch:

jobs:
  run-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Call Backend API
        run: |
          curl -k -X POST https://mad-final-project-production.up.railway.app/api/summary/generate \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"